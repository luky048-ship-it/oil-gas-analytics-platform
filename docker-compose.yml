x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-superset-common: &superset-common
  image: apache/superset:3.1.0
  environment:
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    CACHE_CONFIG: '{"CACHE_TYPE": "RedisCache", "CACHE_DEFAULT_TIMEOUT": 300, "CACHE_KEY_PREFIX": "superset_", "CACHE_REDIS_URL": "redis://redis:6379/0"}'
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - data_net
  logging: *default-logging

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.11
  environment: *airflow-env
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - data_net
  logging: *default-logging

services:
  # 1. PostgreSQL (Хранилище сырых данных и метаданных)
  postgres:
    image: postgres:15.6-alpine
    container_name: pipeline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-sql:/docker-entrypoint-initdb.d 
    networks:
      - data_net
    healthcheck:
      test:["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval:10s
      timeout:5s
      retries:5
    logging: *default-logging

  # 2. MinIO (S3 Data Lake)
  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    container_name: pipeline_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web UI
    volumes:
      - minio_data:/data
    networks:
      - data_net
    healthcheck:
      test:["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval:10s
      timeout:5s
      retries:5
    logging: *default-logging

  # 2.1 MinIO Init (Автоматическое создание бакета для ETL)
  minio-init:
    image: minio/mc:RELEASE.2024-03-14T20-46-17Z
    container_name: pipeline_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - data_net
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb myminio/${MINIO_DEFAULT_BUCKET} --ignore-existing;
      mc anonymous set public myminio/${MINIO_DEFAULT_BUCKET};
      exit 0;
      "

  # 3. Jupyter (Среда разработки ETL и ML)
  jupyter:
    image: jupyter/pyspark-notebook:python-3.11
    container_name: pipeline_jupyter
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      MINIO_URL: "http://minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      PG_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    volumes:
      - ./work:/home/jovyan/work
    networks:
      - data_net
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging

  # 4. Redis (Кэш для Superset - Prod Practice)
  redis:
    image: redis:7.2-alpine
    container_name: pipeline_redis
    restart: unless-stopped
    networks:
      - data_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # 5. Apache Superset (BI)
  superset:
    <<: *superset-common
    container_name: pipeline_superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    command: >
      /bin/sh -c "gunicorn -w 2 --timeout 120 -b 0.0.0.0:8088 --limit-request-line 0 --limit-request-field_size 0 'superset.app:create_app()'"

  # 5.1 Superset Init (Инициализация БД, создание админа)
  superset-init:
    <<: *superset-common
    container_name: pipeline_superset_init
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin --username ${SUPERSET_ADMIN_USER} --firstname Superset --lastname Admin --email admin@example.com --password ${SUPERSET_ADMIN_PASSWORD} &&
      superset init
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- AIRFLOW (Advanced) ---
  airflow-init:
    <<: *airflow-common
    container_name: pipeline_airflow_init
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
    user: "0:0"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    entrypoint: >
      /bin/bash -c "
      mkdir -p /opt/airflow/dags /opt/airflow/logs /opt/airflow/plugins &&
      chown -R ${AIRFLOW_UID}:0 /opt/airflow/{dags,logs,plugins} &&
      airflow db migrate &&
      airflow users create -r Admin -u ${_AIRFLOW_WWW_USER_USERNAME} -p ${_AIRFLOW_WWW_USER_PASSWORD} -e admin@example.com -f Admin -l User || true
      "

  airflow-webserver:
    <<: *airflow-common
    container_name: pipeline_airflow_webserver
    restart: always
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: pipeline_airflow_scheduler
    restart: always
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  data_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
